name: Grip
options:
  bundleIdPrefix: pro.vanderpoel
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Grip:
    type: application
    platform: iOS
    sources:
      - path: Grip
        excludes:
          - Info.plist
          - Grip.entitlements
          - FixtureData
      # The synthetic dataset behind the DEBUG `-fixtures <name>` launch
      # argument (Grip/Fixtures). A folder reference, so its tree arrives in
      # the bundle as-is; excluded from Release below, with the Swift that reads it.
      - path: Grip/FixtureData
        type: folder
        buildPhase: resources
    info:
      path: Grip/Info.plist
      properties:
        CFBundleDisplayName: Grip
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Saira-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSCameraUsageDescription: "Grip gebruikt de camera om brieven voor je dossier te scannen."
        NSFaceIDUsageDescription: "Grip vraagt Face ID zodat alleen jij je dossier opent."
        # The voice quick-log (plan 3 Task 25): recorded and transcribed on the phone.
        NSMicrophoneUsageDescription: "Grip neemt je stem op om een gesprek vast te leggen."
        NSSpeechRecognitionUsageDescription: "Grip zet je opname op je telefoon om in tekst."
        # Long-press the icon. Handled by App/QuickAction.swift.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: pro.vanderpoel.grip.scan
            UIApplicationShortcutItemTitle: "Scan een brief"
            UIApplicationShortcutItemIconSymbolName: doc.text.viewfinder
          - UIApplicationShortcutItemType: pro.vanderpoel.grip.voice
            UIApplicationShortcutItemTitle: "Gesprek vastleggen"
            UIApplicationShortcutItemIconSymbolName: mic
        UIBackgroundModes: [remote-notification]
        # The call sheet's Live Activity (Call/, drawn by GripWidget):
        # counts only on the lock screen — see Shared/CallActivity.swift.
        NSSupportsLiveActivities: true
        # The keychain-access-groups entitlement below, resolved by the same
        # build setting, so KeychainSessionStore names the group it is entitled to.
        GripKeychainAccessGroup: $(AppIdentifierPrefix)pro.vanderpoel.grip
    entitlements:
      path: Grip/Grip.entitlements
      properties:
        # Development-signed builds talk to the APNs SANDBOX; the environment
        # the server stores is read from the embedded profile at runtime
        # (Push/ProvisioningEnvironment.swift), never from this line.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.associated-domains:
          - webcredentials:grip.vanderpoel.pro?mode=developer
        com.apple.security.application-groups:
          - group.pro.vanderpoel.grip
        keychain-access-groups:
          - $(AppIdentifierPrefix)pro.vanderpoel.grip
    dependencies:
      # Embedded in the app (the default for an app-extension dependency).
      - target: GripNotify
      - target: GripShare
      - target: GripWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.grip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Grip
      configs:
        # Fixtures never ship: the files are `#if DEBUG` AND left out of the
        # Release build entirely (FixtureIsolationTests pins both, and
        # scripts/check-release-fixtures.sh checks the built bundle).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "FixtureData Fixture*.swift"
  # The notification service extension: turns a question push's options into
  # answer buttons (a per-question `q.<id>` category) before it is shown. A
  # fourth target beyond spec §7's three — see GripNotify/NotificationService.swift.
  GripNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: GripNotify
        excludes:
          - Info.plist
          - GripNotify.entitlements
      - path: Grip/Push/NotificationCategories.swift
      - path: Grip/Push/QuestionCategories.swift
      - path: Grip/Shared/AppGroup.swift
    info:
      path: GripNotify/Info.plist
      properties:
        CFBundleDisplayName: Grip
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: GripNotify/GripNotify.entitlements
      properties:
        # For push/q-order.json, the order of the registered question categories.
        com.apple.security.application-groups:
          - group.pro.vanderpoel.grip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.grip.notify
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: GripNotify
  # The share extension (spec §7.8, plan 3 Task 22): PDFs, photos and files
  # from any app become an IncomingDrop in the App Group, which the app imports
  # into its upload queue. It never writes the queue itself.
  GripShare:
    type: app-extension
    platform: iOS
    sources:
      - path: GripShare
        excludes:
          - Info.plist
          - GripShare.entitlements
      - path: Grip/Shared/AppGroup.swift
      - path: Grip/Upload/IncomingDrop.swift
      - path: Grip/Upload/UploadItem.swift
      - path: Grip/Upload/UploadRequest.swift
      - path: Grip/Upload/Multipart.swift
      - path: Grip/Upload/ShareSender.swift
      - path: Grip/Upload/SharePreparation.swift
      - path: Grip/Upload/ShareModel.swift
      - path: Grip/Upload/ShareView.swift
      - path: Grip/Scan/PDFAssembler.swift
      - path: Grip/Scan/PageCleaner.swift
      - path: Grip/Scan/ScanNaming.swift
      - path: Grip/Net/APIClient.swift
      - path: Grip/Net/APIError.swift
      - path: Grip/Auth/SessionStore.swift
      - path: Grip/Theme/Tokens.swift
      - path: Grip/Theme/Fonts.swift
      - path: Grip/Resources/Fonts
        buildPhase: resources
    info:
      path: GripShare/Info.plist
      properties:
        CFBundleDisplayName: Grip
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Saira-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        # KeychainSessionStore reads this from Bundle.main — which, in the
        # extension, is THIS Info.plist, not the app's.
        GripKeychainAccessGroup: $(AppIdentifierPrefix)pro.vanderpoel.grip
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # PDFs arrive as files; photos as images. Grip takes TEN per
            # share (ShareModel.maxItems), but is offered for up to 50, so a
            # share of 14 photos gets "Grip neemt de eerste 10 mee" and the
            # range to share again, instead of Grip missing from the sheet
            # with no reason given. Only the first ten are loaded. One web
            # link is accepted ONLY to be answered: "Hier zit geen bestand in"
            # says Grip keeps files and how to make one of the page; a link
            # never travels as a file.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 50
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: GripShare/GripShare.entitlements
      properties:
        # uploads/incoming/, beside the app's queue.
        com.apple.security.application-groups:
          - group.pro.vanderpoel.grip
        # The app's session cookie, for the one foreground upload attempt.
        keychain-access-groups:
          - $(AppIdentifierPrefix)pro.vanderpoel.grip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.grip.share
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: GripShare
  # The home- and lock-screen widget (plan 3 Task 23): reads the App Group
  # snapshot (widget/snapshot.json) and nothing else — no network, no session.
  # Its model and faces live in Grip/Widget, compiled into the app too, so
  # the unit tests (hosted in the app) render them.
  GripWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GripWidget
        excludes:
          - Info.plist
          - GripWidget.entitlements
      - path: Grip/Widget
      - path: Grip/Shared/CallActivity.swift
      - path: Grip/Shared/ScanLetterIntent.swift
      - path: Grip/Shared/WidgetSnapshot.swift
      - path: Grip/Shared/AppGroup.swift
      - path: Grip/Shared/KindLabel.swift
      - path: Grip/Theme/Tokens.swift
      - path: Grip/Theme/Fonts.swift
      - path: Grip/Resources/Fonts
        buildPhase: resources
    info:
      path: GripWidget/Info.plist
      properties:
        CFBundleDisplayName: Grip
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # An extension's Bundle.main is its own: it registers the fonts itself.
        UIAppFonts:
          - Saira-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GripWidget/GripWidget.entitlements
      properties:
        # widget/snapshot.json, written by the app.
        com.apple.security.application-groups:
          - group.pro.vanderpoel.grip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.grip.widget
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: GripWidget
  GripTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GripTests]
    dependencies:
      - target: Grip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.grip.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Grip.app/Grip
        BUNDLE_LOADER: $(TEST_HOST)
  # scripts/capture.sh --press: a long press only a UI test can make. Its
  # own scheme below, so the Grip test action never runs it.
  GripCapture:
    type: bundle.ui-testing
    platform: iOS
    sources: [GripCapture]
    dependencies:
      - target: Grip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.grip.capture
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Grip
schemes:
  GripCapture:
    build:
      targets:
        GripCapture: [test]
    test:
      targets: [GripCapture]
  Grip:
    build:
      targets:
        Grip: all
        GripTests: [test]
    test:
      targets: [GripTests]
