name: Verder
options:
  bundleIdPrefix: pro.vanderpoel
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Verder:
    type: application
    platform: iOS
    sources:
      - path: Verder
        excludes:
          - Info.plist
          - Verder.entitlements
          - FixtureData
      # The synthetic dataset behind the DEBUG `-fixtures <name>` launch
      # argument (Verder/Fixtures). A folder reference, so its tree arrives in
      # the bundle as-is; excluded from Release below, with the Swift that reads it.
      - path: Verder/FixtureData
        type: folder
        buildPhase: resources
    info:
      path: Verder/Info.plist
      properties:
        CFBundleDisplayName: verder
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Saira-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSCameraUsageDescription: "verder gebruikt de camera om brieven te scannen."
        NSFaceIDUsageDescription: "verder vraagt Face ID zodat alleen jij je dossier opent."
        UIBackgroundModes: [remote-notification]
        # The keychain-access-groups entitlement below, resolved by the same
        # build setting, so KeychainSessionStore names the group it is entitled to.
        VerderKeychainAccessGroup: $(AppIdentifierPrefix)pro.vanderpoel.verder
    entitlements:
      path: Verder/Verder.entitlements
      properties:
        # Development-signed builds talk to the APNs SANDBOX; the environment
        # the server stores is read from the embedded profile at runtime
        # (Push/ProvisioningEnvironment.swift), never from this line.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.associated-domains:
          - webcredentials:verder.vanderpoel.pro?mode=developer
        com.apple.security.application-groups:
          - group.pro.vanderpoel.verder
        keychain-access-groups:
          - $(AppIdentifierPrefix)pro.vanderpoel.verder
    dependencies:
      # Embedded in the app (the default for an app-extension dependency).
      - target: VerderNotify
      - target: VerderShare
      - target: VerderWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.verder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Verder
      configs:
        # Fixtures never ship: the files are `#if DEBUG` AND left out of the
        # Release build entirely (FixtureIsolationTests pins both, and
        # scripts/check-release-fixtures.sh checks the built bundle).
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "FixtureData Fixture*.swift"
  # The notification service extension: turns a question push's options into
  # answer buttons (a per-question `q.<id>` category) before it is shown. A
  # fourth target beyond spec §7's three — see VerderNotify/NotificationService.swift.
  VerderNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: VerderNotify
        excludes:
          - Info.plist
          - VerderNotify.entitlements
      - path: Verder/Push/NotificationCategories.swift
      - path: Verder/Push/QuestionCategories.swift
      - path: Verder/Shared/AppGroup.swift
    info:
      path: VerderNotify/Info.plist
      properties:
        CFBundleDisplayName: verder
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: VerderNotify/VerderNotify.entitlements
      properties:
        # For push/q-order.json, the order of the registered question categories.
        com.apple.security.application-groups:
          - group.pro.vanderpoel.verder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.verder.notify
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: VerderNotify
  # The share extension (spec §7.8, plan 3 Task 22): PDFs, photos and files
  # from any app become an IncomingDrop in the App Group, which the app imports
  # into its upload queue. It never writes the queue itself.
  VerderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VerderShare
        excludes:
          - Info.plist
          - VerderShare.entitlements
      - path: Verder/Shared/AppGroup.swift
      - path: Verder/Upload/IncomingDrop.swift
      - path: Verder/Upload/UploadItem.swift
      - path: Verder/Upload/UploadRequest.swift
      - path: Verder/Upload/Multipart.swift
      - path: Verder/Upload/ShareSender.swift
      - path: Verder/Upload/SharePreparation.swift
      - path: Verder/Upload/ShareModel.swift
      - path: Verder/Scan/PDFAssembler.swift
      - path: Verder/Scan/PageCleaner.swift
      - path: Verder/Scan/ScanNaming.swift
      - path: Verder/Net/APIClient.swift
      - path: Verder/Net/APIError.swift
      - path: Verder/Auth/SessionStore.swift
      - path: Verder/Theme/Tokens.swift
      - path: Verder/Theme/Fonts.swift
      - path: Verder/Resources/Fonts
        buildPhase: resources
    info:
      path: VerderShare/Info.plist
      properties:
        CFBundleDisplayName: verder
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - Saira-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        # KeychainSessionStore reads this from Bundle.main — which, in the
        # extension, is THIS Info.plist, not the app's.
        VerderKeychainAccessGroup: $(AppIdentifierPrefix)pro.vanderpoel.verder
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # PDFs arrive as files; photos as images; at most 10 of either.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: VerderShare/VerderShare.entitlements
      properties:
        # uploads/incoming/, beside the app's queue.
        com.apple.security.application-groups:
          - group.pro.vanderpoel.verder
        # The app's session cookie, for the one foreground upload attempt.
        keychain-access-groups:
          - $(AppIdentifierPrefix)pro.vanderpoel.verder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.verder.share
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: VerderShare
  # The home- and lock-screen widget (plan 3 Task 23): reads the App Group
  # snapshot (widget/snapshot.json) and nothing else — no network, no session.
  # Its model and faces live in Verder/Widget, compiled into the app too, so
  # the unit tests (hosted in the app) render them.
  VerderWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VerderWidget
        excludes:
          - Info.plist
          - VerderWidget.entitlements
      - path: Verder/Widget
      - path: Verder/Shared/WidgetSnapshot.swift
      - path: Verder/Shared/AppGroup.swift
      - path: Verder/Shared/KindLabel.swift
      - path: Verder/Theme/Tokens.swift
      - path: Verder/Theme/Fonts.swift
      - path: Verder/Resources/Fonts
        buildPhase: resources
    info:
      path: VerderWidget/Info.plist
      properties:
        CFBundleDisplayName: verder
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # An extension's Bundle.main is its own: it registers the fonts itself.
        UIAppFonts:
          - Saira-Variable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: VerderWidget/VerderWidget.entitlements
      properties:
        # widget/snapshot.json, written by the app.
        com.apple.security.application-groups:
          - group.pro.vanderpoel.verder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.verder.widget
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: VerderWidget
  VerderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VerderTests]
    dependencies:
      - target: Verder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.vanderpoel.verder.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Verder.app/Verder
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Verder:
    build:
      targets:
        Verder: all
        VerderTests: [test]
    test:
      targets: [VerderTests]
